<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | Sultana Élégance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <meta name="theme-color" content="#c8a24a">
  <style>
    .auth-page { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .auth-brand { background: linear-gradient(135deg, var(--bg-secondary), rgba(200,162,74,0.08)); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; text-align: center; position: relative; overflow: hidden; }
    .auth-brand img { width: 240px; margin-bottom: 32px; filter: drop-shadow(0 8px 32px var(--shadow-gold)); }
    .auth-brand h2 { font-family: "Cinzel", Georgia, serif; font-size: 2rem; margin-bottom: 16px; color: var(--text-primary); }
    .auth-brand p { color: var(--text-muted); max-width: 320px; }
    .auth-panel { display: flex; align-items: center; justify-content: center; padding: 60px; background: var(--bg-primary); position: relative; }
    .auth-box { width: 100%; max-width: 440px; }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 32px; background: var(--bg-secondary); padding: 6px; border-radius: 16px; }
    .auth-tab { flex: 1; padding: 12px; border-radius: 12px; border: 0; background: transparent; font: inherit; font-weight: 800; font-size: 0.92rem; cursor: pointer; color: var(--text-muted); transition: all 0.3s ease; }
    .auth-tab.active { background: linear-gradient(135deg, var(--text-primary), #1a2535); color: var(--bg-primary); box-shadow: 0 8px 24px var(--shadow-color); }

    /* FIX: class-based show/hide so display:none is never overridden by !important */
    .auth-form { display: none; gap: 16px; width: 100%; }
    .auth-form.form-active { display: grid; }

    .auth-form label { display: block; color: var(--text-primary); font-weight: 800; font-size: 0.92rem; margin-bottom: 6px; }
    .auth-form input, .auth-form select {
      display: block; width: 100%; min-height: 56px; padding: 0 18px;
      border: 1.5px solid var(--border-color); border-radius: 18px;
      color: var(--text-primary); background: var(--bg-secondary);
      font: inherit; font-size: 0.95rem; outline: none; box-sizing: border-box;
    }
    .auth-form input:focus, .auth-form select:focus {
      border-color: var(--accent-gold); background: var(--bg-primary);
      box-shadow: 0 0 0 5px var(--shadow-gold);
    }
    .auth-form .button { width: 100%; min-height: 56px; margin-top: 8px; }
    .auth-form .form-message { min-height: 24px; margin: 6px 0 0; font-weight: 800; font-size: 0.92rem; }
    .auth-form .form-message.error { color: var(--accent-rose); }
    .auth-form .form-message.success { color: #4caf50; }

    .auth-footer { text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 0.9rem; }
    .auth-footer a { color: var(--accent-gold); font-weight: 700; }
    .auth-theme-toggle { position: fixed; top: 24px; right: 24px; z-index: 100; }

    @media (max-width: 880px) {
      .auth-page { grid-template-columns: 1fr; }
      .auth-brand { display: none; }
      .auth-panel { padding: 80px 24px 40px; }
    }
  </style>
</head>
<body data-page="page">
  <div class="auth-theme-toggle">
    <button class="theme-toggle" id="themeToggle" aria-label="Changer le thème">
      <span class="icon-sun" style="font-size:0.8rem;z-index:1;">☀</span>
      <span class="icon-moon" style="font-size:0.8rem;z-index:1;">☾</span>
      <span class="toggle-thumb"></span>
    </button>
  </div>

  <div class="auth-page">
    <div class="auth-brand">
      <img src="assets/images/logo.png" alt="Sultana Élégance">
      <h2>L'élégance à portée de main</h2>
      <p>Connectez-vous pour accéder à vos réservations, favoris et bien plus.</p>
    </div>

    <div class="auth-panel">
      <div class="auth-box">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Connexion</button>
          <button class="auth-tab" data-tab="register">Inscription</button>
        </div>

        <!-- LOGIN -->
        <form class="auth-form form-active" id="loginForm" novalidate>
          <div>
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" name="email" placeholder="vous@email.com" required>
          </div>
          <div>
            <label for="loginPassword">Mot de passe</label>
            <input type="password" id="loginPassword" name="password" placeholder="••••••••" required minlength="6">
          </div>
          <button type="submit" class="button button-primary">Se connecter</button>
          <p class="form-message" id="loginMessage"></p>
        </form>

        <!-- REGISTER -->
        <form class="auth-form" id="registerForm" novalidate>
          <div>
            <label for="regName">Nom complet</label>
            <input type="text" id="regName" name="name" placeholder="Votre nom" required>
          </div>
          <div>
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" name="email" placeholder="vous@email.com" required>
          </div>
          <div>
            <label for="regPhone">Téléphone</label>
            <input type="tel" id="regPhone" name="phone" placeholder="+212 6XX XXX XXX" inputmode="tel" pattern="[0-9+\s]*" maxlength="20">
          </div>
          <div>
            <label for="regCity">Ville</label>
            <select id="regCity" name="city">
              <option value="">Choisir une ville</option>
              <option value="Casablanca">Casablanca</option>
              <option value="Rabat">Rabat</option>
              <option value="Marrakech">Marrakech</option>
              <option value="Tanger">Tanger</option>
              <option value="Fès">Fès</option>
            </select>
          </div>
          <div>
            <label for="regSize">Taille habituelle</label>
            <select id="regSize" name="size_profile">
              <option value="">Choisir une taille</option>
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
            </select>
          </div>
          <div>
            <label for="regPassword">Mot de passe</label>
            <input type="password" id="regPassword" name="password" placeholder="Min. 6 caractères" required minlength="6">
          </div>
          <button type="submit" class="button button-primary">Créer mon compte</button>
          <p class="form-message" id="registerMessage"></p>
        </form>

        <div class="auth-footer">
          <a href="index.html">← Retour à l'accueil</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/script.js"></script>
  <script>
    const API_BASE = 'http://localhost/projet%20web/backend/api/';

    // Tab switching — class based only, no inline style
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('form-active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Form').classList.add('form-active');
      });
    });

    // Phone: digits only
    document.getElementById('regPhone').addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9+\s]/g, '');
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('loginMessage');
      const btn = e.target.querySelector('button[type=submit]');
      msg.textContent = '';
      msg.className = 'form-message';
      btn.disabled = true;
      btn.textContent = 'Connexion…';

      try {
        const fd = new FormData();
        fd.append('email',    document.getElementById('loginEmail').value.trim());
        fd.append('password', document.getElementById('loginPassword').value);

        const result = await fetch(API_BASE + 'login.php', { method: 'POST', body: fd, credentials: 'include' }).then(r => r.json());

        if (result.success) {
          msg.textContent = 'Bienvenue, ' + result.name + ' !';
          msg.classList.add('success');
          setTimeout(() => { window.location.href = result.role === 'admin' ? 'admin.html' : 'index.html'; }, 500);
        } else {
          msg.textContent = result.error || 'Erreur de connexion';
          msg.classList.add('error');
          btn.disabled = false;
          btn.textContent = 'Se connecter';
        }
      } catch {
        msg.textContent = 'Erreur réseau — vérifiez que MySQL est démarré dans XAMPP.';
        msg.classList.add('error');
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('registerMessage');
      const btn = e.target.querySelector('button[type=submit]');
      msg.textContent = '';
      msg.className = 'form-message';
      btn.disabled = true;
      btn.textContent = 'Création…';

      try {
        const fd = new FormData();
        fd.append('name',         document.getElementById('regName').value);
        fd.append('email',        document.getElementById('regEmail').value);
        fd.append('phone',        document.getElementById('regPhone').value);
        fd.append('city',         document.getElementById('regCity').value);
        fd.append('size_profile', document.getElementById('regSize').value);
        fd.append('password',     document.getElementById('regPassword').value);

        const result = await fetch(API_BASE + 'register.php', { method: 'POST', body: fd, credentials: 'include' }).then(r => r.json());

        if (result.success) {
          // Pre-fill login and switch tab automatically
          document.getElementById('loginEmail').value    = document.getElementById('regEmail').value;
          document.getElementById('loginPassword').value = document.getElementById('regPassword').value;
          document.getElementById('registerForm').reset();
          msg.textContent = 'Compte créé ! Redirection vers la connexion…';
          msg.classList.add('success');
          setTimeout(() => document.querySelector('[data-tab="login"]').click(), 900);
        } else {
          msg.textContent = result.error;
          msg.classList.add('error');
          btn.disabled = false;
          btn.textContent = 'Créer mon compte';
        }
      } catch {
        msg.textContent = 'Erreur réseau';
        msg.classList.add('error');
        btn.disabled = false;
        btn.textContent = 'Créer mon compte';
      }
    });
  </script>
</body>
</html>
